name: 问题反馈
description: 报告可以复现的功能、部署或页面问题。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请勿填写 API Key、密码、会话 Cookie 或真实 .env 内容。
        安全漏洞请按 SECURITY.md 私下反馈，不要在公开 Issue 中披露。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 预期结果与实际结果分别是什么？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: 版本或提交
      description: 填写 Git 提交号或部署的版本；不确定时请注明。
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 运行环境
      options:
        - Vercel
        - 本地开发
        - 独立 Node.js 部署
        - 其他
    validations:
      required: true
  - type: dropdown
    id: credentials_mode
    attributes:
      label: 凭证模式
      description: 只选择模式，不填写任何凭证值。
      options:
        - 浏览器填写凭证，无面板密码
        - 面板密码登录，浏览器填写凭证
        - 面板密码登录，服务端固定 VPS 凭证
        - 不确定
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 浏览器与操作系统
      placeholder: Chrome 版本 / macOS，Safari 版本 / iOS 等
  - type: textarea
    id: evidence
    attributes:
      label: 截图或错误信息
      description: |
        可提供请求编号、错误码和已脱敏的日志。
        截图请遮挡 VEID、IP、API Key、密码和会话信息。
